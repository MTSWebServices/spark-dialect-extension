name: Tests Clickhouse

on:
  push:
    branches:
      - develop
  pull_request:
    branches-ignore:
      - master
  workflow_dispatch:

env:
  DEFAULT_JAVA: '11'
  MIN_PROJECT_COVERAGE: 80
  MIN_FILE_COVERAGE: 80

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    strategy:
      matrix:
        clickhouse-jdbc-version: ['0.7.2', '0.9.2']

    services:
      clickhouse:
        # https://github.com/ClickHouse/clickhouse-java/issues/2636
        image: clickhouse/clickhouse-server:25.9-alpine
        env:
          TZ: UTC
          CLICKHOUSE_DB: spark
          CLICKHOUSE_USER: spark
          CLICKHOUSE_PASSWORD: 123UsedForTestOnly@!
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.DEFAULT_JAVA }}
        uses: actions/setup-java@v4
        with:
          java-version: '${{ env.DEFAULT_JAVA }}'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          cache-overwrite-existing: true

      - name: Run Integration Tests with Coverage
        run: |
          ./gradlew test -Dclickhouse.jdbc.version=${{ matrix.clickhouse-jdbc-version }}

      - name: Upload coverage results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-jdbc-${{ matrix.clickhouse-jdbc-version }}
          path: build/reports/jacoco/test/*.xml
          # https://github.com/actions/upload-artifact/issues/602
          include-hidden-files: true

  all_done:
    name: Tests done
    runs-on: ubuntu-latest

    permissions:
      contents: write
      checks: write
      pull-requests: write

    if: success() || failure()
    needs: [tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all coverage reports
        uses: actions/download-artifact@v8
        with:
          path: build/reports/
          pattern: coverage-*
          merge-multiple: true

      - name: Show test results
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: build/reports/jacoco/test/*.xml

      - name: Coverage comment
        id: coverage
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/*.xml
          token: ${{ secrets.AUTOMERGE_TOKEN }}
          min-coverage-overall: ${{ env.MIN_PROJECT_COVERAGE }}
          min-coverage-changed-files: ${{ env.MIN_FILE_COVERAGE }}
          title: Coverage
          update-comment: true
          skip-if-no-changes: true

      - name: Dynamic Badges
        uses: schneegans/dynamic-badges-action@v1.8.0
        if: github.repository == 'MTSWebServices/spark-dialect-extension' && github.event_name == 'push'
        with:
          auth: ${{ secrets.AUTOMERGE_TOKEN }}
          gistID: 03e73a82ecc4709934540ce8201cc3b4
          filename: spark-dialect-extension_badge.json
          label: Coverage
          message: ${{ steps.coverage.outputs.coverage-overall }}
          color: ${{ (steps.coverage.outputs.coverage-overall < env.MIN_PROJECT_COVERAGE || steps.coverage.outputs.coverage-changed-files < env.MIN_FILE_COVERAGE) && 'red' || 'green' }}
